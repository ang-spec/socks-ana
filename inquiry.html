<body class="inquiry-page">
	<header class="sub-header">
		<div class="header-inner">
			<a href="index.html" class="sub-logo">靴下の穴診断</a>
		</div>
	</header>
	<main class="inquiry-container">
		<h1>お問い合わせ</h1>

		<!-- 企業・メーカー様向け案内枠 -->
		<div class="business-notice">
			<strong class="notice-title">【 🏢 企業・メーカー様へ 】</strong>
			<p class="notice-text">
				コラボ企画 / タイアップ / スポンサー掲載 / 取材等のご相談も承っております。<br>
				お気軽にお問い合わせください。
			</p>
		</div>

		<form id="contact-form" action="https://formspree.io/f/xqpkvanr" method="post" class="inquiry-form">
			<div class="form-group">
				<label for="name">お名前</label>
				<input type="text" id="name" name="name" required placeholder="例：靴下 太郎">
			</div>

			<div class="form-group">
				<label for="email">メールアドレス</label>
				<input type="email" id="email" name="email" required placeholder="例：example@email.com">
			</div>

			<div class="form-group">
				<label for="message">お問い合わせ内容</label>
				<textarea id="message" name="message" rows="5" required placeholder="ここにメッセージをご入力ください"></textarea>
			</div>

			<button type="submit" class="submit-btn">送信する</button>
		</form>
	</main>
